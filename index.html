<!doctype html>
<html lang="no">
<head>

<title>Gig-settliste v7.1</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--panel2:#24272b;--text:#f4f5f7;--muted:#a6abb3;--accent:#68b8ff;--accent2:#ffb347;--border:#30343a;--played:#33363a;--danger:#ff7777;--active:#172633}
*{box-sizing:border-box}html{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{width:min(820px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;padding:9px 0 12px;background:linear-gradient(var(--bg) 88%,transparent)}.row{display:flex;gap:7px;align-items:center}.projectrow{display:grid;grid-template-columns:1fr auto;gap:7px;margin:18px 0 8px}.projectrow select,.setlistrow select,#search,.sceneSearch{min-height:46px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);padding:0 12px;outline:none}.projectrow select:focus,.setlistrow select:focus,#search:focus,.sceneSearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(104,184,255,.22);background:#172633}.projectrow a{min-height:46px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);color:var(--text);padding:0 11px;display:flex;align-items:center;text-decoration:none;font-size:12px;font-weight:800}
#search{width:100%;font-size:17px}.iconbtn{min-width:48px;min-height:46px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);color:var(--muted)}.primaryrow{display:flex;gap:7px;margin-top:7px}.suggest,.modebtn{min-height:39px;border-radius:9px;font-weight:800}.suggest{flex:1;border:0;background:var(--accent);color:#07131e}.modebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.modebtn{border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px}.modebtn.active{background:var(--panel2);color:var(--text);border-color:#5b6671}.counter{font-size:12px;color:var(--muted);white-space:nowrap}.filters{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:31px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}.chip.active{background:var(--panel2);color:var(--text);border-color:#59616c}
.dashboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:8px 0 12px}.stat{padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel);text-align:center}.stat strong{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.recent{margin:0 0 12px}.recent h2,.sectionhead h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.recentlist{display:flex;gap:6px;overflow-x:auto;padding-top:6px}.recentitem{flex:0 0 auto;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 3px 7px}.sectionhead span{font-size:11px;color:var(--muted)}
.songlist{display:flex;flex-direction:column;gap:7px}.song{border:1px solid var(--border);border-radius:13px;padding:11px 12px;background:var(--panel);cursor:pointer}.song.active{border-color:var(--accent);background:var(--active)}.songhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.title{font-size:17px;line-height:1.15;font-weight:800}.artist{margin-top:2px;color:var(--muted);font-size:13px}.star{border:0;background:transparent;color:#7e838b;font-size:22px;padding:0 2px}.star.on{color:#ffd66b}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.badge{display:inline-flex;min-height:22px;align-items:center;padding:2px 7px;border-radius:6px;background:var(--panel2);font-size:11px;font-weight:750;color:#dce0e5}.badge.start{color:#bde1ff}.notes{display:none;margin-top:9px;color:#c8ccd2;font-size:13px;line-height:1.42}.song.active .notes{display:block}
.pulsewrap{display:none;align-items:center;gap:8px;margin-top:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#12171c}.song.active .pulsewrap{display:flex}.pulsedot,.scenePulse{width:16px;height:16px;border-radius:50%;background:var(--accent);opacity:.28;transform:scale(.78)}.pulsedot.beat,.scenePulse.beat{opacity:1;transform:scale(1.28)}.pulsedot.downbeat,.scenePulse.downbeat{background:var(--accent2);box-shadow:0 0 0 6px rgba(255,179,71,.22);opacity:1}.pulsetext{font-size:11px;color:var(--muted);font-weight:750}.pulsetoggle{margin-left:auto;min-height:30px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);font-size:11px;font-weight:750}.actions{display:none;grid-template-columns:1fr auto;gap:7px;margin-top:11px}.song.active .actions{display:grid}.markplayed{min-height:43px;border:0;border-radius:9px;background:var(--accent);color:#07131e;font-weight:850}.smallaction{min-width:46px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text)}
.played .song{background:var(--played);opacity:.58}.played .title{text-decoration:line-through;text-decoration-thickness:1px}.played .meta,.played .notes,.played .star,.played .pulsewrap{display:none}.empty{padding:16px;border:1px dashed var(--border);border-radius:11px;color:var(--muted);text-align:center;font-size:13px}
.forcedpanel{display:none;margin:10px 0 12px;padding:10px;border:1px solid var(--border);border-radius:11px;background:var(--panel)}.forcedpanel.show{display:block}.setlistrow{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-bottom:8px}.setlistrow button,.forcedactions button,.forcedbuilder button{min-height:38px;border:1px solid var(--border);border-radius:8px;background:#15181b;color:var(--text);font-size:11px;font-weight:750}.forcedhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.forcedhead strong{font-size:13px}.forcedactions{display:flex;gap:6px;flex-wrap:wrap}.forcedbuilder{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:8px}.forcedbuilder input{min-height:38px;border:1px solid var(--border);border-radius:8px;background:#15181b;color:var(--text);padding:0 10px}.forcedlist{display:grid;gap:6px}.forceditem{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:7px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:#15181b;cursor:pointer}.forceditem.pauseitem{grid-template-columns:28px 1fr auto auto;background:#181818;border-style:dashed}.forceditem.activeforced{border-color:var(--accent);background:#172633}.forceditem.playedset{opacity:.45}.forceditem .num{color:var(--muted);font-size:11px;text-align:center}.forceditem .fmeta strong{display:block;font-size:13px}.forceditem .fmeta small{color:var(--muted);font-size:11px}.forceditem button{min-width:32px;min-height:30px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text)}.forcednext{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#142434;color:#cfeaff;font-size:12px;font-weight:750}.sceneToggle{margin-top:8px;width:100%;min-height:36px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:11px;font-weight:800}
.tools{margin-top:23px;padding-top:14px;border-top:1px solid var(--border)}.tools summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.toolgrid button,.filelabel{min-height:41px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;text-decoration:none}.reset{color:var(--danger)!important;border-color:#573636!important}.filelabel input{display:none}
.scene{display:none}body.scene-mode .app{width:min(620px,100%);padding-top:env(safe-area-inset-top)}body.scene-mode .topbar,body.scene-mode .dashboard,body.scene-mode .recent,body.scene-mode section:not(.scene):not(.forcedpanel),body.scene-mode .projectrow,body.scene-mode .tools{display:none!important}body.scene-mode .forcedpanel{display:none!important}body.scene-mode .scene{display:block;padding:18px 4px 28px}.sceneCurrent{text-align:center;padding:18px 10px 16px}.sceneCurrent .sceneTitle{font-size:30px;font-weight:900;line-height:1.05}.sceneCurrent .sceneArtist{margin-top:7px;color:var(--muted);font-size:17px}.scenePulseWrap{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0 10px}.scenePulse{width:38px;height:38px}.scenePulse.beat{transform:scale(1.35)}.sceneBpm{font-size:24px;font-weight:900}.sceneStart{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;background:var(--panel2);font-size:12px;font-weight:850}.pulseOptions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.pulseOptions button{min-height:48px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:12px;font-weight:850}.pulseOptions button.active{background:var(--panel2);border-color:#5b6671}.sceneControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.sceneControls button,.sceneSearchRow button{min-height:48px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:800}.sceneControls .scenePlayed{background:var(--accent);color:#07131e;border:0}.sceneSearchRow{display:grid;grid-template-columns:1fr auto;gap:7px;margin:12px 0}.sceneSearch{width:100%}.sceneNext{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}.sceneNext h3{margin:0 0 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.sceneQueue{display:grid;gap:7px}.sceneQueue .qitem{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer}.sceneQueue .qitem strong{display:block}.sceneQueue .qitem small{color:var(--muted)}.sceneExit{width:100%;margin-top:10px;min-height:42px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--muted)}
dialog{width:min(92vw,500px);border:1px solid var(--border);border-radius:16px;padding:0;background:var(--panel);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.75)}.dialoginner{padding:18px}.dialoginner h3{margin:0 0 5px;font-size:20px}.dialoginner p{margin:0 0 13px;color:var(--muted);font-size:13px}.suggestions{display:grid;gap:7px}.suggestion{border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);text-align:left;padding:11px}.suggestion strong{display:block;font-size:16px}.suggestion small{color:var(--muted)}.reason{display:block;margin-top:4px;font-size:10px;color:#89c9ff}.dialogbuttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.secondarydialog{min-height:41px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);font-weight:750}.close{width:100%;min-height:41px;border:0;border-radius:9px;background:var(--accent);color:#07131e;font-weight:800}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);z-index:50;padding:9px 13px;border-radius:9px;background:#eef1f4;color:#111;font-size:12px;font-weight:700;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:650px){.songlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="row"><input id="search" type="search" placeholder="Søk låt, artist, BPM, tag …"><button class="iconbtn" id="clearSearch">×</button></div>
  <div class="primaryrow"><button class="suggest" id="suggestBtn">🎲 Foreslå neste</button><div class="counter" id="totalCount"></div><div class="counter" id="feedStatus"></div></div>
  <div class="modebar"><button class="modebtn active" id="freeModeBtn">Fri modus</button><button class="modebtn" id="forcedModeBtn">Tvungen settliste</button><button class="modebtn" id="freeSceneBtn">Scenemodus</button></div>
  <div class="filters" id="filters"><button class="chip active" data-filter="alle">Alle</button><button class="chip" data-filter="favoritt">★ Favoritter</button><button class="chip" data-filter="rock">Rock</button><button class="chip" data-filter="blues">Blues</button><button class="chip" data-filter="dans">Dans</button><button class="chip" data-filter="singalong">Singalong</button><button class="chip" data-filter="rolig">Rolig</button><button class="chip" data-filter="tell">Tell opp</button><button class="chip" data-filter="slowbpm">&lt; 90</button><button class="chip" data-filter="midbpm">90–119</button><button class="chip" data-filter="fastbpm">120+</button></div>
</header>

<section class="forcedpanel" id="forcedPanel">
  <div class="setlistrow"><select id="setlistSelect"></select><button id="newSetlistBtn">+ Ny</button><button id="renameSetlistBtn">Gi nytt navn</button></div>
  <div class="forcedhead"><strong>Tvungen settliste</strong><div class="forcedactions"><button id="addPauseBtn">+ Pause</button><button id="clearSetBtn">Tøm</button></div></div>
  <div class="forcedbuilder"><input id="setSongSearch" list="songOptions" placeholder="Søk låt og legg til …"><button id="addToSetBtn">Legg til</button></div>
  <datalist id="songOptions"></datalist>
  <div class="forcedlist" id="forcedList"></div>
  <div class="forcednext" id="forcedNext" style="display:none"></div>
  <button class="sceneToggle" id="sceneModeBtn">Åpne scenemodus</button>
</section>

<section class="dashboard"><div class="stat"><strong id="setNo">1</strong><span>Sett</span></div><div class="stat"><strong id="setCount">0</strong><span>I dette settet</span></div><div class="stat"><strong id="playedTotal">0</strong><span>Spilt totalt</span></div></section>
<section class="recent" id="recentSection"><h2>Sist spilt</h2><div class="recentlist" id="recentList"></div></section>
<section><div class="sectionhead"><h2>Ikke spilt</h2><span id="remainingCount"></span></div><div id="remaining" class="songlist"></div></section>
<section><div class="sectionhead"><h2>Spilt · trykk for å angre</h2><span id="playedCount"></span></div><div id="played" class="songlist played"></div></section>

<section class="scene" id="sceneView">
  <div class="sceneCurrent">
    <div class="sceneTitle" id="sceneTitle">Ingen aktiv låt</div><div class="sceneArtist" id="sceneArtist"></div>
    <div class="scenePulseWrap"><div class="scenePulse" id="scenePulse"></div><div class="sceneBpm" id="sceneBpm">— BPM</div></div>
    <div class="sceneStart" id="sceneStart" style="display:none"></div>
    <div class="pulseOptions"><button id="scenePulseToggle">Puls: av</button><button id="sceneHalfToggle">Halvtempo: av</button><button id="sceneAccentToggle">4/4-aksent: på</button></div>
  </div>
  <div class="sceneSearchRow"><input class="sceneSearch" id="sceneSearch" type="search" placeholder="Søk låt i prosjektet …"><button id="sceneSearchBtn">Søk</button></div>
  <div class="sceneControls"><button class="scenePlayed" id="scenePlayedBtn">✓ Ferdig</button><button id="scenePrevBtn">← Forrige</button></div>
  <button class="sceneExit" id="sceneExitBtn">← Tilbake til settliste</button>
  <button class="sceneExit" id="sceneRefreshBtn" style="display:none">↻ Tre nye forslag</button>
  <div class="sceneNext"><h3 id="sceneQueueTitle">Neste</h3><div class="sceneQueue" id="sceneQueue"></div></div>
</section>

<div class="projectrow">
  <select id="projectSelectTop" aria-label="Prosjekt"></select>
  <a href="editor.html">Editor</a>
</div>
<details class="tools"><summary>Verktøy og data</summary><div class="toolgrid"><button id="newSetBtn">Nytt sett</button><button id="undoBtn">Angre siste</button><button id="wakeBtn">Skjerm alltid på: av</button><button id="autoNextBtn">Auto-neste: på</button><button id="refreshSongsBtn">Oppdater data nå</button><button id="exportBtn">Eksporter backup</button><button class="reset" id="resetBtn">Nullstill kveld</button></div></details>
</main>

<dialog id="suggestDialog"><div class="dialoginner"><h3>Forslag til neste</h3><p>Ser på de fem siste låtene i prosjektet og vurderer artist, tempo, energi, tags og favoritter.</p><div class="suggestions" id="suggestions"></div><div class="dialogbuttons"><button class="secondarydialog" id="refreshSuggestions">↻ Tre nye forslag</button><button class="close" id="closeDialog">Lukk</button></div></div></dialog>
<div class="toast" id="toast"></div>

<script>
const FALLBACK_SONGS = [{"title":"Abracadabra","artist":"Steve Miller Band","notes":"Tell 1-2-3-4-1-2-3-BAM > Rett på med skarpslag - crash (S BB). Disco beat, gå over til ride helt mot slutten. Dovregubben på slutten, gitar alene, rock outro.","bpm":129,"start":"TELL","tags":["rock","dans"],"energy":"høy","id":"abracadabra-steve-miller-band","projects":["pubband"]},{"title":"Black Magic Woman","artist":"Santana","notes":"To x klakk på bjelle før hi-hat. 2 veiver, før overgang til vers. Kubjelle + hi-hat + kantslag på vers. Ride + solo > vers m/kubjelle. Siste runde med hh. 7 ridecrash på slutten.","bpm":124,"start":"BJELLE","tags":["latin","rock","blues"],"energy":"middels","id":"black-magic-woman-santana","projects":["pubband"]},{"title":"Breakfast In America","artist":"Supertramp","notes":"Intro på gitar > inn etter to takter, med minivirvel. Stopp etter slutt på ref. Leken ride på bridge, kort. Stopp. Naa-naa. Slutter med ride + crash. Rit på slutten.","bpm":75,"start":"GITAR","tags":["pop","rolig"],"energy":"rolig","id":"breakfast-in-america-supertramp","projects":["pubband"]},{"title":"Brown Eyed Girl","artist":"Van Morrison","notes":"Tell opp, Halvslag hi-hat fra start, husk kant slag i intro 4. slag bass\nFader ut?","bpm":150,"start":"TELL","tags":["pop","dans","singalong"],"energy":"høy","id":"brown-eyed-girl-van-morrison","projects":["pubband"]},{"title":"Can’t Help Falling In Love","artist":"Elvis Presley","notes":"Rett på med visper eller rods 16-dels hi hat + basstromme. Rit på slutten","bpm":100,"start":"RETT PÅ","tags":["rolig","ballade"],"energy":"rolig","id":"cant-help-falling-in-love-elvis-presley","projects":["pubband"]},{"title":"Come Together","artist":"The Beatles","notes":"Husk klut over gulvtam. Tell opp: 4x hh > vers > 4x hh > vers > 4x hh > vers > 2x hh > overg. crash/ride rytme (solo) > stopp. Vers g.tom > 4x hh > overg. crash/ride rytme (outro).","bpm":83,"start":"TELL","tags":["rock","groove"],"energy":"middels","id":"come-together-the-b function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function norm(v){return String(v??"").toLocaleLowerCase("nb-NO").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function slug(v){return norm(v).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("id"+Date.now())}
function uid(prefix="id"){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function songById(id){return songs.find(s=>s.id===id)}
function currentProject(){return projects.find(p=>p.id===activeProjectId)||projects[0]}
function currentProjectSongs(){const p=currentProject();return songs.filter(s=>(s.projects||[]).includes(p?.id))}
function currentSetlists(){const p=currentProject();p.setlists||=[];if(!p.setlists.length)p.setlists.push({id:"standard",name:"Standard",items:[]});return p.setlists}
function currentSetlist(){const lists=currentSetlists();let found=lists.find(l=>l.id===activeSetlistId)||lists[0];activeSetlistId=found.id;return found}
function pst(){const id=currentProject()?.id||"default";state.projectState[id]||={played:[],history:[],favorites:[]};return state.projectState[id]}
function isPlayed(id){return pst().played.includes(id)}
function isFav(id){return pst().favorites.includes(id)}

function sorted(a){return [...a].sort((x,y)=>x.title.localeCompare(y.title,"nb",{sensitivity:"base"}))}
function bpmBand(b){if(!b)return"ukjent"; if(b<90)return"rolig"; if(b<120)return"middels"; return"rask"}

async function fetchJsonFile(name,fallback){
  const r=await fetch(`./${name}?v=${Date.now()}`,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
  if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);
  const d=await r.json();
  if(name==="songs.json"){const list=Array.isArray(d)?d:(d&&Array.isArray(d.songs)?d.songs:null); if(!list)throw new Error("Ugyldig songs.json"); return list}
  if(name==="projects.json"){const list=Array.isArray(d)?d:(d&&Array.isArray(d.projects)?d.projects:null); if(!list)throw new Error("Ugyldig projects.json"); return list}
  return d||fallback;
}
function normalizeData(){
  const ids=new Set();
  songs=songs.map(s=>{if(!s.id)s.id=slug(`${s.title} ${s.artist}`);let base=s.id,i=2;while(ids.has(s.id)){s.id=base+"-"+i++;}ids.add(s.id);s.projects=s.projects&&s.projects.length?s.projects:[projects[0]?.id||"default"];return s});
  if(!projects.length)projects=[{id:"default",name:"Standard",setlists:[{id:"standard",name:"Standard",items:[]}]}];
  projects.forEach(p=>{p.setlists||=[];if(!p.setlists.length)p.setlists=[{id:"standard",name:"Standard",items:[]}];p.setlists.forEach(l=>{l.items||=[];l.items=l.items.map(it=>typeof it==="string"?{type:"song",songId:it}:it)})});
  if(!activeProjectId||!projects.some(p=>p.id===activeProjectId))activeProjectId=projects[0].id;
}
async function loadData({manual=false}={}){
  try{
    const [freshSongs,freshProjects]=await Promise.all([fetchJsonFile("songs.json",FALLBACK_SONGS),fetchJsonFile("projects.json",FALLBACK_PROJECTS)]);
    songs=freshSongs;projects=freshProjects;normalizeData();saveData();setFeedStatus("Data oppdatert"); if(manual)toast("Data oppdatert"); return true;
  }catch(err){
    const cached=JSON.parse(localStorage.getItem(DATA_KEY)||"null");
    if(cached&&Array.isArray(cached.songs)&&Array.isArray(cached.projects)){songs=cached.songs;projects=cached.projects;normalizeData();setFeedStatus("Offline-data"); if(manual)toast("Kunne ikke hente data – bruker lagret versjon"); return false}
    songs=structuredClone(FALLBACK_SONGS);projects=structuredClone(FALLBACK_PROJECTS);normalizeData();setFeedStatus("Fallback-data"); if(manual)toast("Kunne ikke hente data"); return false;
  }
}

function matchFilter(s){if(activeFilter==="alle")return true;if(activeFilter==="favoritt")return isFav(s.id);if(activeFilter==="tell")return s.start==="TELL";if(activeFilter==="slowbpm")return s.bpm&&s.bpm<90;if(activeFilter==="midbpm")return s.bpm&&s.bpm>=90&&s.bpm<120;if(activeFilter==="fastbpm")return s.bpm&&s.bpm>=120;return(s.tags||[]).includes(activeFilter)||s.energy===activeFilter}
function matchesSearch(s,q){if(!q)return true;return norm([s.title,s.artist,s.bpm?`${s.bpm} bpm`:"",s.start,s.energy,...(s.tags||[]),s.notes].join(" ")).includes(norm(q))}
function makeCard(s,done=false){
  const c=document.createElement("div");c.className="song"+(!done&&activeSongId===s.id?" active":"");c.dataset.id=s.id;c.tabIndex=0;c.setAttribute("role","button");
  const meta=[s.start?`<span class="badge start">${esc(s.start)}</span>`:"",s.bpm?`<span class="badge">${s.bpm} BPM</span>`:`<span class="badge">BPM ?</span>`,s.energy?`<span class="badge">${esc(s.energy)}</span>`:"",...(s.tags||[]).slice(0,3).map(x=>`<span class="badge">${esc(x)}</span>`)].join("");
  c.innerHTML=`<div class="songhead"><div><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div>${done?"":`<button class="star ${isFav(s.id)?"on":""}">${isFav(s.id)?"★":"☆"}</button>`}</div><div class="meta">${meta}</div>${done?"":`<div class="pulsewrap"><span class="pulsedot"></span><span class="pulsetext">${s.bpm?`${s.bpm} BPM`:"BPM ?"}</span><button class="pulsetoggle">${pulseEnabled?"Puls: på":"Puls: av"}</button></div>`}<div class="notes">${esc(s.notes||"").replace(/\n/g,"<br>")}</div>${done?"":`<div class="actions"><button class="markplayed">✓ MARKER SOM SPILT</button><button class="smallaction">×</button></div>`}`;
  if(done)c.onclick=()=>restoreSong(s.id);else{
    const toggle=e=>{if(e.target.closest("button"))return;activeSongId=activeSongId===s.id?null:s.id;render();if(activeSongId)scrollSongVisible(s.id)};
    c.onclick=toggle;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(e)}};
    c.querySelector(".star").onclick=e=>{e.stopPropagation();toggleFavorite(s.id)};
    c.querySelector(".markplayed").onclick=e=>{e.stopPropagation();markPlayed(s.id)};
    c.querySelector(".smallaction").onclick=e=>{e.stopPropagation();activeSongId=null;render()};
    c.querySelector(".pulsetoggle").onclick=e=>{e.stopPropagation();togglePulse(s)};
  }
  return c;
}
function render(){

  if(!available.length)$("remaining").innerHTML=`<div class="empty">${q||activeFilter!=="alle"?"Ingen treff.":"Alle låtene i prosjektet er spilt."}</div>`;
  if(!done.length&&(q||activeFilter!=="alle"))$("played").innerHTML=`<div class="empty">Ingen treff blant spilte låter.</div>`;
  $("remainingCount").textContent=`${base.length-pst().played.filter(id=>base.some(s=>s.id===id)).length} igjen`;
  $("playedCount").textContent=`${pst().played.length} spilt`;$("totalCount").textContent=`${base.length} låter`;$("playedTotal").textContent=pst().played.length;
  const pid=currentProject().id;state.setNoByProject[pid]||=1;state.setStartsByProject[pid]||=[0];$("setNo").textContent=state.setNoByProject[pid];$("setCount").textContent=Math.max(0,pst().history.length-(state.setStartsByProject[pid][state.setNoByProject[pid]-1]||0));
  $("wakeBtn").textContent=`Skjerm alltid på: ${wakeEnabled?"på":"av"}`;$("autoNextBtn").textContent=`Auto-neste: ${autoNext?"på":"av"}`;
  renderRecent();renderMode(); if(pulseEnabled&&activeSongId)startPulse(songById(activeSongId));else stopPulse();

  const lists=currentSetlists();$("setlistSelect").innerHTML=lists.map(l=>`<option value="${esc(l.id)}">${esc(l.name)}</option>`).join("");if(!lists.some(l=>l.id===activeSetlistId))activeSetlistId=lists[0].id;$("setlistSelect").value=activeSetlistId;
}
function renderRecent(){const last=[...pst().history].reverse().slice(0,5);$("recentSection").style.display=last.length?"block":"none";$("recentList").replaceChildren(...last.map(id=>{const s=songById(id),e=document.createElement("button");e.className="recentitem";e.textContent=s?`${s.title} · ${s.artist}`:id;e.onclick=()=>restoreSong(id);return e}))}
function renderMode(){$("freeModeBtn").classList.toggle("active",appMode==="free");$("forcedModeBtn").classList.toggle("active",appMode==="forced");$("forcedPanel").classList.toggle("show",appMode==="forced");$("suggestBtn").style.display=appMode==="forced"?"none":"block";renderForcedSet()}
function renderForcedSet(){
  const list=$("forcedList"),set=currentSetlist().items,base=currentProjectSongs();$("songOptions").innerHTML=base.map(s=>`<option value="${esc(s.title)}">${esc(s.artist)}</option>`).join("");
  if(!set.length){list.innerHTML='<div class="empty">Ingen låter i denne settlisten.</div>';$("forcedNext").style.display="none";return}
  list.innerHTML=set.map((item,i)=>{if(item.type==="pause")return `<div class="forceditem pauseitem" data-index="${i}"><div class="num">${i+1}</div><div class="fmeta"><strong>— PAUSE —</strong><small>${esc(item.label||"Settpause")}</small></div><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div>`;const s=songById(item.songId);if(!s)return"";return `<div class="forceditem ${isPlayed(s.id)?"playedset":""} ${activeSongId===s.id?"activeforced":""}" data-id="${esc(s.id)}" data-index="${i}"><div class="num">${i+1}</div><div class="fmeta"><strong>${esc(s.title)}</strong><small>${esc(s.artist)}${s.bpm?` · ${s.bpm} BPM`:""}</small></div><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-remove="${i}">×</button></div>`}).join("");
  const next=nextForcedSongId(),s=songById(next);$("forcedNext").style.display="block";$("forcedNext").textContent=s?`Neste: ${s.title} · ${s.artist}`:"Ingen flere låter i settlisten.";
}
function nextForcedSongId(){const items=currentSetlist().items,idx=activeSongId?items.findIndex(x=>x.type==="song"&&x.songId===activeSongId):-1;for(let i=idx+1;i<items.length;i++)if(items[i].type==="song"&&!isPlayed(items[i].songId))return items[i].songId;for(const it of items)if(it.type==="song"&&!isPlayed(it.songId))return it.songId;return null}
function previousForcedSongId(){const items=currentSetlist().items,idx=activeSongId?items.findIndex(x=>x.type==="song"&&x.songId===activeSongId):-1;if(idx<0)return null;for(let i=idx-1;i>=0;i--)if(items[i].type==="song")return items[i].songId;return null}
function scrollSceneTop(){requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:"auto"}))}
function scrollSongVisible(id,{behavior="smooth"}={}){requestAnimationFrame(()=>{const el=document.querySelector(`.song[data-id="${CSS.escape(id)}"]`);if(!el)return;const header=document.querySelector(".topbar"),offset=(header?.getBoundingClientRect().height||0)+10,target=Math.max(0,el.getBoundingClientRect().top+window.scrollY-offset);window.scrollTo({top:target,left:0,behavior})})}
function resetAndFocusSearch(){
  if(appMode!=="free")return;
  $("search").value="";
  $("sceneSearch").value="";
  activeFilter="alle";syncFilterUI();
  requestAnimationFrame(()=>{
    const target=document.body.classList.contains("scene-mode")?$("sceneSearch"):$("search");
    target?.focus({preventScroll:true});
    if(document.body.classList.contains("scene-mode"))scrollSceneTop();
  });
}
function activateSong(id,{fromScene=false}={}){const s=songById(id);if(!s)return;if(isPlayed(id)){pst().played=pst().played.filter(x=>x!==id);pst().history=pst().history.filter(x=>x!==id);saveState()}activeSongId=id;if(!fromScene){activeFilter="alle";$("search").value=s.title;syncFilterUI();render();scrollSongVisible(id)}else{renderScene()}}
function markPlayed(id){const ps=pst(),was=activeSongId===id,inScene=document.body.classList.contains("scene-mode");if(!ps.played.includes(id))ps.played.push(id);ps.history=ps.history.filter(x=>x!==id);ps.history.push(id);saveState();stopPulse();if(appMode==="forced"&&autoNext&&was)activeSongId=nextForcedSongId()||null;else if(was)activeSongId=null;if(appMode==="free"&&inScene){sceneSuggestions=[];renderScene();resetAndFocusSearch()}else if(inScene){renderScene()}else{render();resetAndFocusSearch()}toast("Markert som spilt")}
function restoreSong(id){const ps=pst();ps.played=ps.played.filter(x=>x!==id);ps.history=ps.history.filter(x=>x!==id);saveState();render();toast("Flyttet tilbake")}
function toggleFavorite(id){const ps=pst();ps.favorites=isFav(id)?ps.favorites.filter(x=>x!==id):[...ps.favorites,id];saveState();render()}

function togglePulse(song){if(!song||!song.bpm){toast("Mangler BPM");return}pulseEnabled=!pulseEnabled;if(pulseEnabled)startPulse(song);else stopPulse();renderScene();render()}
function stopPulse(){if(pulseTimer){clearInterval(pulseTimer);pulseTimer=null}pulseBeat=0;document.querySelectorAll(".pulsedot,.scenePulse").forEach(d=>d.classList.remove("beat","downbeat"))}
function startPulse(song){stopPulse();if(!pulseEnabled||!song||!song.bpm)return;const bpm=pulseHalf?song.bpm/2:song.bpm,interval=60000/bpm;const beat=()=>{pulseBeat=(pulseBeat%4)+1;document.querySelectorAll(".song.active .pulsedot,.scenePulse").forEach(dot=>{dot.classList.add("beat");if(pulseAccent&&pulseBeat===1)dot.classList.add("downbeat");setTimeout(()=>dot.classList.remove("beat","downbeat"),Math.min(140,interval*.35))})};beat();pulseTimer=setInterval(beat,interval)}

function suggestionScore(s,recentIds){let n=Math.random()*1.5,recent=recentIds.map(songById).filter(Boolean),last=recent.at(-1);if(isFav(s.id))n+=4;if(last){n+=s.artist!==last.artist?4:-9;n+=bpmBand(s.bpm)!==bpmBand(last.bpm)?1.75:-1;n-=(s.tags||[]).filter(t=>(last.tags||[]).includes(t)).length*1.4;if(s.energy!==last.energy)n+=1.25}n-=recent.filter(r=>r.artist===s.artist).length*3.5;n-=recent.filter(r=>bpmBand(r.bpm)===bpmBand(s.bpm)).length*.7;n-=recent.filter(r=>r.energy===s.energy).length*.9;for(const tag of(s.tags||[]))n-=recent.filter(r=>(r.tags||[]).includes(tag)).length*.55;const last3=recent.slice(-3);if(last3.length===3&&last3.every(r=>r.energy===last3[0].energy))n+=s.energy!==last3[0].energy?3.5:-3.5;const last2=recent.slice(-2);if(last2.length===2&&last2.every(r=>r.energy==="rolig"))n+=s.energy==="høy"?4:(s.energy==="middels"?2.5:-4);if(last2.length===2&&last2.every(r=>r.energy==="høy"))n+=s.energy==="middels"?2.5:(s.energy==="rolig"?1.5:-1.5);return n}
function suggestionReason(s,recentIds){const recent=recentIds.map(songById).filter(Boolean),last=recent.at(-1),r=[];if(isFav(s.id))r.push("★ favoritt");if(last&&s.artist!==last.artist)r.push("ny artist");if(last&&bpmBand(s.bpm)!==bpmBand(last.bpm))r.push("tempo-variasjon");if(last&&s.energy!==last.energy)r.push("energi-variasjon");const last2=recent.slice(-2);if(last2.length===2&&last2.every(x=>x.energy==="rolig")&&s.energy!=="rolig")r.push("løfter energien");if(last2.length===2&&last2.every(x=>x.energy==="høy")&&s.energy!=="høy")r.push("gir luft");return r.slice(0,3)}
function smartSuggestions(excludeId=null){return currentProjectSongs().filter(s=>!isPlayed(s.id)&&s.id!==excludeId).map(s=>({s,score:suggestionScore(s,pst().history.slice(-5))})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.s)}
function showSuggestions(){const picks=smartSuggestions();$("suggestions").replaceChildren(...picks.map(s=>{const b=document.createElement("button");b.className="suggestion";b.innerHTML=`<strong>${esc(s.title)}</strong><small>${esc(s.artist)}</small><span class="reason">${esc([s.bpm?`${s.bpm} BPM`:"BPM ?",...(s.tags||[]).slice(0,2)].join(" · "))}<br>${esc(suggestionReason(s,pst().history.slice(-5)).join(" · "))}</span>`;b.onclick=()=>{activeSongId=s.id;$("suggestDialog").close();$("search").value=s.title;render()};return b}));if(!picks.length)$("suggestions").innerHTML='<div class="empty">Alle låtene er spilt.</div>';$("suggestDialog").showModal()}
function syncFilterUI(){document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.filter===activeFilter))}

function openScene(){document.body.classList.add("scene-mode");if(appMode==="forced"&&!activeSongId)activeSongId=nextForcedSongId();else if(appMode==="free")refreshSceneSuggestions(false);renderScene();scrollSceneTop()}
function closeScene(){document.body.classList.remove("scene-mode");stopPulse();if(activeSongId){const s=songById(activeSongId);$("search").value=s?s.title:"";activeFilter="alle";syncFilterUI()}render()}
function refreshSceneSuggestions(show=True){sceneSuggestions=smartSuggestions(activeSongId).map(s=>s.id);if(show)renderScene()}
function chooseSceneSuggestion(id){activeSongId=id;sceneSuggestions=[];renderScene();scrollSceneTop()}
function renderScene(){const s=songById(activeSongId);$("sceneTitle").textContent=s?s.title:(appMode==="free"?"Velg neste låt":"Ingen aktiv låt");$("sceneArtist").textContent=s?s.artist:"";$("sceneBpm").textContent=s?(s.bpm?`${s.bpm} BPM`:"BPM ?"):"— BPM";$("sceneStart").textContent=s?.start||"";$("sceneStart").style.display=s?.start?"inline-flex":"none";$("scenePulseToggle").textContent=`Puls: ${pulseEnabled?"på":"av"}`;$("sceneHalfToggle").textContent=`Halvtempo: ${pulseHalf?"på":"av"}`;$("sceneAccentToggle").textContent=`4/4-aksent: ${pulseAccent?"på":"av"}`;$("sceneHalfToggle").classList.toggle("active",pulseHalf);$("sceneAccentToggle").classList.toggle("active",pulseAccent);$("scenePulseToggle").classList.toggle("active",pulseEnabled);$("scenePrevBtn").style.display=appMode==="forced"?"block":"none";$("sceneRefreshBtn").style.display=appMode==="free"?"block":"none";$("scenePlayedBtn").style.display=s?"block":"none";$("sceneSearch").style.display=appMode==="free"?"block":"none";$("sceneSearchBtn").style.display=appMode==="free"?"block":"none";$("sceneQueueTitle").textContent=appMode==="free"?"Forslag":"Neste";
  let items=[];if(appMode==="free"){if(!sceneSuggestions.length)refreshSceneSuggestions(false);items=sceneSuggestions.map(songById).filter(Boolean)}else{const set=currentSetlist().items,idx=activeSongId?set.findIndex(x=>x.type==="song"&&x.songId===activeSongId):-1;for(let i=idx+1;i<set.length&&items.length<2;i++){if(set[i].type==="pause")items.push({pause:true,label:set[i].label||"Settpause"});else{const q=songById(set[i].songId);if(q)items.push(q)}}}
  $("sceneQueue").innerHTML=items.length?items.map(q=>q.pause?`<div class="qitem"><strong>— PAUSE —</strong><small>${esc(q.label)}</small></div>`:`<div class="qitem" data-id="${esc(q.id)}"><strong>${esc(q.title)}</strong><small>${esc(q.artist)}${q.bpm?` · ${q.bpm} BPM`:""}${appMode==="free"?` · ${esc(suggestionReason(q,pst().history.slice(-5)).join(" · "))}`:""}</small></div>`).join(""):'<div class="qitem"><small>Ingen forslag.</small></div>';
  if(document.body.classList.contains("scene-mode")&&pulseEnabled&&s)startPulse(s);
}
function sceneSearch(){const q=norm($("sceneSearch").value.trim());if(!q)return;const found=currentProjectSongs().find(s=>norm(s.title)===q)||currentProjectSongs().find(s=>norm(s.title).includes(q)||norm(s.artist).includes(q));if(found)chooseSceneSuggestion(found.id);else toast("Fant ikke låt")}

function addSongToSet(){const raw=$("setSongSearch").value.trim();if(!raw)return;const found=currentProjectSongs().find(s=>norm(s.title)===norm(raw))||currentProjectSongs().find(s=>norm(s.title).includes(norm(raw)));if(!found){alert("Fant ikke låten.");return}currentSetlist().items.push({type:"song",songId:found.id});$("setSongSearch").value="";saveData();renderForcedSet()}
function addPause(){const label=prompt("Navn på pausen:","Settpause");if(label===null)return;currentSetlist().items.push({type:"pause",label:label.trim()||"Settpause"});saveData();renderForcedSet()}
function newSetlist(){const name=prompt("Navn på ny settliste:");if(!name)return;const l={id:uid("set"),name:name.trim(),items:[]};currentProject().setlists.push(l);activeSetlistId=l.id;saveData();render()}
function renameSetlist(){const l=currentSetlist(),name=prompt("Nytt navn:",l.name);if(!name)return;l.name=name.trim();saveData();render()}

$("projectSelectTop").onchange=e=>{activeProjectId=e.target.value;activeSongId=null;activeSetlistId=null;sceneSuggestions=[];saveState();render()};
$("freeModeBtn").onclick=()=>{appMode="free";localStorage.setItem("gig-settliste-mode-v1",appMode);render()};
$("forcedModeBtn").onclick=()=>{appMode="forced";localStorage.setItem("gig-settliste-mode-v1",appMode);render()};
$("freeSceneBtn").onclick=()=>{appMode="free";localStorage.setItem("gig-settliste-mode-v1",appMode);openScene()};
$("suggestBtn").onclick=showSuggestions;$("refreshSuggestions").onclick=showSuggestions;$("closeDialog").onclick=()=>$("suggestDialog").close();
$("search").oninput=render;$("clearSearch").onclick=()=>{$("search").value="";render();$("search").focus()};
$("filters").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;activeFilter=b.dataset.filter;syncFilterUI();render()};
$("setlistSelect").onchange=e=>{activeSetlistId=e.target.value;renderForcedSet()};$("newSetlistBtn").onclick=newSetlist;$("renameSetlistBtn").onclick=renameSetlist;$("addToSetBtn").onclick=addSongToSet;$("addPauseBtn").onclick=addPause;$("clearSetBtn").onclick=()=>{if(confirm("Tømme denne settlisten?")){currentSetlist().items=[];saveData();renderForcedSet()}};
$("forcedList").onclick=e=>{const item=e.target.closest(".forceditem"),set=currentSetlist().items;if(!item)return;const i=Number(item.dataset.index);if(e.target.dataset.up!==undefined){if(i>0){[set[i-1],set[i]]=[set[i],set[i-1]];saveData();renderForcedSet()}return}if(e.target.dataset.down!==undefined){if(i<set.length-1){[set[i+1],set[i]]=[set[i],set[i+1]];saveData();renderForcedSet()}return}if(e.target.dataset.remove!==undefined){set.splice(i,1);saveData();renderForcedSet();return}if(item.dataset.id)activateSong(item.dataset.id)};
$("sceneModeBtn").onclick=()=>{appMode="forced";localStorage.setItem("gig-settliste-mode-v1",appMode);openScene()};$("sceneExitBtn").onclick=closeScene;$("sceneRefreshBtn").onclick=()=>refreshSceneSuggestions(true);$("sceneQueue").onclick=e=>{const c=e.target.closest("[data-id]");if(c)chooseSceneSuggestion(c.dataset.id)};$("scenePlayedBtn").onclick=()=>{if(activeSongId)markPlayed(activeSongId)};$("scenePrevBtn").onclick=()=>{const p=previousForcedSongId();if(p){activeSongId=p;renderScene();scrollSceneTop()}};$("sceneSearchBtn").onclick=sceneSearch;$("sceneSearch").addEventListener("keydown",e=>{if(e.key==="Enter")sceneSearch()});
$("scenePulseToggle").onclick=()=>{const s=songById(activeSongId);if(s)togglePulse(s)};$("sceneHalfToggle").onclick=()=>{pulseHalf=!pulseHalf;localStorage.setItem("gig-settliste-pulse-half-v1",pulseHalf?"1":"0");renderScene()};$("sceneAccentToggle").onclick=()=>{pulseAccent=!pulseAccent;localStorage.setItem("gig-settliste-pulse-accent-v1",pulseAccent?"1":"0");renderScene()};
$("newSetBtn").onclick=()=>{const p=currentProject().id;state.setNoByProject[p]=(state.setNoByProject[p]||1)+1;state.setStartsByProject[p]||=[0];state.setStartsByProject[p].push(pst().history.length);saveState();render()};$("undoBtn").onclick=()=>{const last=pst().history.at(-1);last?restoreSong(last):toast("Ingen låt å angre")};
$("wakeBtn").onclick=async()=>{wakeEnabled=!wakeEnabled;localStorage.setItem(WAKE_KEY,wakeEnabled?"1":"0");await updateWake();render()};$("autoNextBtn").onclick=()=>{autoNext=!autoNext;localStorage.setItem("gig-settliste-autonext-v1",autoNext?"1":"0");render()};
$("refreshSongsBtn").onclick=async()=>{await loadData({manual:true});render()};$("resetBtn").onclick=()=>{if(confirm("Nullstille kveld for dette prosjektet?")){state.projectState[currentProject().id]={played:[],history:[],favorites:pst().favorites};activeSongId=null;saveState();render()}};
$("exportBtn").onclick=()=>{const payload={version:7,exportedAt:new Date().toISOString(),songs,projects,state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`gig-settliste-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};
async function updateWake(){if(!wakeEnabled||!("wakeLock"in navigator)){if(wakeLock){await wakeLock.release().catch(()=>{});wakeLock=null}return}try{wakeLock=await navigator.wakeLock.request("screen")}catch{}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wakeEnabled)updateWake()});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
loadData().then(()=>{render();updateWake()});
</script>
</body>
</html>
