<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--panel2:#24272b;--text:#f4f5f7;--muted:#a6abb3;--accent:#68b8ff;--border:#30343a;--danger:#ff7777;--input:#141619;--accentText:#07131e;--dangerBorder:#583838}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--panel2:#e9edf2;--text:#15181c;--muted:#65707c;--accent:#1473e6;--border:#cbd3dc;--danger:#a52727;--input:#fff;--accentText:#fff;--dangerBorder:#d5a1a1}*{box-sizing:border-box}html{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{width:min(820px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 88%,transparent)}.row{display:flex;gap:7px}.back,.primary,.secondary,.danger{min-height:42px;border-radius:10px;padding:0 12px;font-weight:750}.back,.secondary{border:1px solid var(--border);background:var(--panel);color:var(--text);text-decoration:none;display:flex;align-items:center}.primary{border:0;background:var(--accent);color:var(--accentText)}.danger{border:1px solid var(--dangerBorder);background:transparent;color:var(--danger)}input,textarea,select{border:1px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);padding:10px}#search{width:100%;margin-top:7px;min-height:46px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.list{display:grid;gap:7px}.item{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px 11px}.itemhead{display:flex;justify-content:space-between;gap:10px}.item strong{display:block;font-size:16px}.item small{color:var(--muted)}.editbtn{border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);min-width:58px}.projectdelete{border:1px solid var(--dangerBorder);border-radius:8px;background:transparent;color:var(--danger);min-height:34px;padding:0 9px;font-size:12px;font-weight:800}.meta{color:var(--muted);font-size:12px;margin:8px 0}dialog{width:min(94vw,620px);max-height:90dvh;overflow:auto;border:1px solid var(--border);border-radius:16px;padding:0;background:var(--panel);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.75)}form{padding:17px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}textarea{min-height:130px;resize:vertical}.formactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.projectsbox{display:grid;gap:6px;padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--input)}.projectsbox label{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.tab{min-height:38px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--muted);font-weight:800}.tab.active{background:var(--panel2);color:var(--text)}.projectlist{display:grid;gap:7px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.field.full{grid-column:auto}}

.editorProjectRow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:8px 0 2px}.editorProjectRow label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.editorProjectRow select{width:100%;min-height:42px}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.dialoghead h2{margin:0;font-size:18px}.dialogclose{width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);font-size:20px}.itemactions{display:flex;gap:6px;align-items:center}.usebtn{border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);min-height:34px;padding:0 9px;font-size:12px;font-weight:800}.usebtn.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}.projecthint{margin:9px 0 4px;color:var(--muted);font-size:12px;line-height:1.35}.tools{margin:12px 0;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px}.tools summary{cursor:pointer;font-weight:800;color:var(--text)}:root[data-theme="light"] dialog::backdrop{background:rgba(0,0,0,.42)}

/* v8 editor datastatus */.draftBanner{display:none;margin:8px 0;padding:9px 11px;border:1px solid #a66b16;border-radius:10px;background:rgba(255,179,71,.10);color:var(--text);font-size:12px;font-weight:800}.draftBanner.show{display:block}.validation{white-space:pre-line;line-height:1.4}.actions button,.actions label{min-height:44px}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="row"><a class="back" href="index.html">← Settliste</a><button class="primary" id="addSongBtn">+ Ny låt</button><button class="secondary" id="addProjectBtn">+ Prosjekt</button></div><input id="search" type="search" placeholder="Søk …"><div class="tabs"><button class="tab active" data-tab="songs">Låter</button><button class="tab" data-tab="projects">Prosjekter</button></div><div class="editorProjectRow"><label for="projectFilter">Prosjekt</label><select id="projectFilter"></select></div><div class="projecthint" id="projectHint"></div></div>
<p class="meta" id="status"></p><div class="draftBanner" id="draftBanner">● Lokale endringer er ikke publisert til GitHub ennå.</div>
<details class="tools"><summary>Verktøy og data</summary><div class="actions"><button class="secondary" id="themeBtn" aria-label="Bytt tema">Tema: mørk</button><button class="primary" id="exportAllBtn">Eksporter alt</button><button class="primary" id="exportSongsBtn">Eksporter songs.json</button><button class="primary" id="exportProjectsBtn">Eksporter projects.json</button><label class="secondary">Importer songs.json<input id="importSongs" type="file" accept=".json,application/json" hidden></label><label class="secondary">Importer projects.json<input id="importProjects" type="file" accept=".json,application/json" hidden></label><label class="secondary">Importer alt<input id="importAll" type="file" accept=".json,application/json" hidden></label><button class="secondary" id="reloadBtn">Hent publisert data</button><button class="danger" id="discardBtn">Forkast utkast</button></div><p class="meta" style="margin-top:10px">System: <strong>Gig-settliste v8.0</strong></p></details>
<p class="meta" id="count"></p>
<div id="songsList" class="list"></div><div id="projectsList" class="projectlist" style="display:none"></div>
</main>

<dialog id="songDialog"><form id="songForm"><div class="dialoghead"><h2 id="songDialogTitle">Låt</h2><button type="button" class="dialogclose" id="closeSongBtn" aria-label="Lukk">×</button></div><input type="hidden" id="songId"><div class="grid"><div class="field full"><label>Tittel</label><input id="title" required></div><div class="field full"><label>Artist</label><input id="artist" required></div><div class="field"><label>BPM</label><input id="bpm" type="number" min="1" max="300"></div><div class="field"><label>Start</label><input id="start"></div><div class="field"><label>Energi</label><select id="energy"><option value="rolig">rolig</option><option value="middels">middels</option><option value="høy">høy</option></select></div><div class="field"><label>Tags</label><input id="tags" placeholder="rock, dans"></div><div class="field full"><label>Prosjekter</label><div class="projectsbox" id="songProjects"></div></div><div class="field full"><label>Notater</label><textarea id="notes"></textarea></div></div><div class="formactions"><button type="button" class="secondary" id="cancelSongBtn">Avbryt</button><button class="primary">Lagre</button></div><button type="button" class="danger" id="deleteSongBtn" style="width:100%;margin-top:8px">Slett låt</button></form></dialog>
<dialog id="projectDialog"><form id="projectForm"><div class="dialoghead"><h2 id="projectDialogTitle">Prosjekt</h2><button type="button" class="dialogclose" id="closeProjectBtn" aria-label="Lukk">×</button></div><input type="hidden" id="projectId"><div class="field"><label>Prosjektnavn</label><input id="projectName" required></div><div class="formactions"><button type="button" class="secondary" id="cancelProjectBtn">Avbryt</button><button class="primary">Lagre</button></div><button type="button" class="danger" id="deleteProjectBtn" style="width:100%;margin-top:8px">Slett prosjekt</button></form></dialog>

<script>
const FALLBACK_SONGS = [{"title":"Abracadabra","artist":"Steve Miller Band","notes":"Tell 1-2-3-4-1-2-3-BAM > Rett på med skarpslag - crash (S BB). Disco beat, gå over til ride helt mot slutten. Dovregubben på slutten, gitar alene, rock outro.","bpm":129,"start":"TELL","tags":["rock","dans"],"energy":"høy","id":"abracadabra-steve-miller-band","projects":["kes"]},{"title":"Black Magic Woman","artist":"Santana","notes":"To x klakk på bjelle før hi-hat. 2 veiver, før overgang til vers. Kubjelle + hi-hat + kantslag på vers. Ride + solo > vers m/kubjelle. Siste runde med hh. 7 ridecrash på slutten.","bpm":124,"start":"BJELLE","tags":["latin","rock","blues"],"energy":"middels","id":"black-magic-woman-santana","projects":["kes"]},{"title":"Breakfast In America","artist":"Supertramp","notes":"Intro på gitar > inn etter to takter, med minivirvel. Stopp etter slutt på ref. Leken ride på bridge, kort. Stopp. Naa-naa. Slutter med ride + crash. Rit på slutten.","bpm":75,"start":"GITAR","tags":["pop","rolig"],"energy":"rolig","id":"breakfast-in-america-supertramp","projects":["kes"]},{"title":"Brown Eyed Girl","artist":"Van Morrison","notes":"Tell opp, Halvslag hi-hat fra start, husk kant slag i intro 4. slag bass\nFader ut?","bpm":150,"start":"TELL","tags":["pop","dans","singalong"],"energy":"høy","id":"brown-eyed-girl-van-morrison","projects":["kes"]},{"title":"Can’t Help Falling In Love","artist":"Elvis Presley","notes":"Rett på med visper eller rods 16-dels hi hat + basstromme. Rit på slutten","bpm":100,"start":"RETT PÅ","tags":["rolig","ballade"],"energy":"rolig","id":"cant-help-falling-in-love-elvis-presley","projects":["kes"]},{"title":"Come Together","artist":"The Beatles","notes":"Husk klut over gulvtam. Tell opp: 4x hh > vers > 4x hh > vers > 4x hh > vers > 2x hh > overg. crash/ride rytme (solo) > stopp. Vers g.tom > 4x hh > overg. crash/ride rytme (outro).","bpm":83,"start":"TELL","tags":["rock","groove"],"energy":"middels","id":"come-together-the-beatles","projects":["kes"]},{"title":"Crazy Little Thing Called Love","artist":"Queen","notes":"Beg. med gitar. Elvis swing beat på hi-hat > stopp på hvert vers. Husk brekk på slutt av ref, klikking etter første bass. Etter solo, slutt med dempet crash > brekk > til klappeparti > ‘love’, kom inn igjen med skarp > vers > Når ikke synger mer, stopp med 1-2-3-4-5-6 på ride","bpm":152,"start":"GITAR","tags":["rock","dans"],"energy":"høy","id":"crazy-little-thing-called-love-queen","projects":["kes"]},{"title":"Dead Flowers","artist":"The Rolling Stones","notes":"Litt fart her. Tell opp, starter med roll, kommer > 4/4. Avslutter etter siste “Won’t forget to put roses on your grave” 1-2-krasj","bpm":130,"start":"TELL","tags":["rock","country"],"energy":"høy","id":"dead-flowers-the-rolling-stones","projects":["kes"]},{"title":"Deidres Samba","artist":"Cornelis Vreeswijk","notes":"Tell opp: Sambarytme m/fast b.tr + hh sammen med Ekka. Harmoniser. BB H BB H","bpm":120,"start":"TELL","tags":["samba","rolig"],"energy":"rolig","id":"deidres-samba-cornelis-vreeswijk","projects":["kes"]},{"title":"Dimples","artist":"John Lee Hooker","notes":"Blues: Beg. m/gitar, gå over til (B S B S BB) + swingride på hi-hsy. Varier med ride og crash. Husk slutt, hold slagene på skarp i basslinje, slutt.","bpm":137,"start":"GITAR","tags":["blues","dans"],"energy":"høy","id":"dimples-john-lee-hooker","projects":["kes"]},{"title":"Englishman In New York","artist":"Sting","notes":"Tell opp, begynner m/tom TT T splash > hi-hat virvel/splash + b.tromme + kantslag (gjennomgående) > ref. ride > vers > ref. ride > overgang til bridge > stadion-basstromme-veiv x 2 > roll overg. til vers + 6 x ‘be your self’ singalon > ref > roll overg. til stadion beat 2 x > slutt.","bpm":102,"start":"TELL","tags":["pop","reggae"],"energy":"middels","id":"englishman-in-new-york-sting","projects":["kes"]},{"title":"Folsom Prison Blues","artist":"Johnny Cash","notes":"Intro på gitar + b.tromme -> Train beat. Ride på solo To ganger på slutten, før avslutn.","bpm":102,"start":"GITAR","tags":["country","dans"],"energy":"høy","id":"folsom-prison-blues-johnny-cash","projects":["kes"]},{"title":"From Hank to Hendrix","artist":"Neil Young","notes":"For det meste stomping på hi-hat, veksle med soft beat","bpm":109,"start":"RETT PÅ","tags":["rolig","country"],"energy":"rolig","id":"from-hank-to-hendrix-neil-young","projects":["kes"]},{"title":"Get It On","artist":"T. Rex","notes":"Beg. m/gitar. Kommer inn m S B, S B. 4/4 hi-hat > Alle slag på ‘Get in on’. Stopp etter tredje ref. «Get in on», en takt etter.","bpm":127,"start":"GITAR","tags":["rock","dans"],"energy":"høy","id":"get-it-on-t-rex","projects":["kes"]},{"title":"Help Me","artist":"Sonny Boy Williamson II","notes":"Rett på. Slow blues, slepende visper eller mutet driv (BSBSBSSBS) Ride på slutten. Stopp, to slag på ride helt slutt.","bpm":114,"start":"RETT PÅ","tags":["blues","rolig"],"energy":"rolig","id":"help-me-sonny-boy-williamson-ii","projects":["kes"]},{"title":"Human","artist":"The Killers","notes":"Rett på med hi-hat 16-del. Gå på med pumpebass > kutt hi-hat på første ref (kun b.tromme) > over til beat med gulvtam ut låta > evt veiv med kun basstr. for singalong > over til kun b.tromme (stopp rett før ‘are we dancer’).","bpm":135,"start":"RETT PÅ","tags":["pop","dans","singalong"],"energy":"høy","id":"human-the-killers","projects":["kes"]},{"title":"I Heard It Through The Grapewine","artist":"Creedence Clearwater Revival","notes":"Tell opp: Rett på med hi-hat på 2. slag (4 takter), før kommer inn på 4/4. Etter ref > tam-er i 8 takter (3 ganger) > solo > avslutn.","bpm":119,"start":"TELL","tags":["rock","groove"],"energy":"middels","id":"i-heard-it-through-the-grapewine-creedence-clearwater-revival","projects":["kes"]},{"title":"I Shot The Sheriff","artist":"Eric Clapton","notes":"Git start > Start med hh+b.tromme > kommer inn T SS T. Etter 3. vers, to runder før avslutning.","bpm":94,"start":"GITAR","tags":["reggae","blues"],"energy":"middels","id":"i-shot-the-sheriff-eric-clapton","projects":["kes"]},{"title":"I’m Gonna Be (500 Miles)","artist":"The Proclaimers","notes":"Tell opp > Starter med hi-hat, går over til b.trommeslag + skarp. To vers -> ref, nananana. Stopp. Intro med basslag + skarp to takter, kommer mer inn. Husk stopp, synkope ‘coming hooome’. Bygger opp før siste vers/ref.","bpm":132,"start":"TELL","tags":["pop","dans","singalong"],"energy":"høy","id":"im-gonna-be-500-miles-the-proclaimers","projects":["kes"]},{"title":"I’ll Be Your Baby Tonight","artist":"Bob Dylan","notes":"Tell opp: Rett på med enkel 4/4 (HSHS), perk på 3. vers > ‘stopp’ med perk etter big fat moon’s gonna shine like a spoon. Husk egen outtro, kjør som vanlig.","bpm":128,"start":"TELL","tags":["country","rolig"],"energy":"rolig","id":"ill-be-your-baby-tonight-bob-dylan","projects":["kes"]},{"title":"Is This Love","artist":"Bob Marley","notes":"Tell opp sakte, husk tempo, rett på med kantslag. Alle b-slag. Krydre med perk.","bpm":122,"start":"TELL","tags":["reggae","dans"],"energy":"høy","id":"is-this-love-bob-marley","projects":["kes"]},{"title":"La Bamba","artist":"Los Lobos","notes":"Gitarintro, beat over annenhver tom. Husk hardt stopp etter første vers, hardt stopp etter solo. En runde med bamba, så Beatles-slutt.","bpm":161,"start":"GITAR","tags":["latin","dans","singalong"],"energy":"høy","id":"la-bamba-los-lobos","projects":["kes"]},{"title":"Light My Fire","artist":"The Doors","notes":"Tell opp 1-2-3-4-1-2-3-smekk! Husk egen vri etter solo. Etter solo, 1-2-3-4, 1-2-3-4, deretter vers + ref. 2x. Etter stopp, tell 1-2-3-smekk! til avslutning. Husk rit!","bpm":129,"start":"TELL","tags":["rock"],"energy":"høy","id":"light-my-fire-the-doors","projects":["kes"]},{"title":"Make Me Smile (Come Up and See Me)","artist":"Steve Harley & Cockney Rebel","notes":"Beg m/skala git/bass, 1111-11 på gulvtom, trommer inn på «You got it all». Husk harde stopp. Kan hende prat i mellom. Slutten; ref i ett to ganger, 4 slag på slutten.","bpm":144,"start":"GITAR/BASS","tags":["rock","pop","singalong"],"energy":"høy","id":"make-me-smile-come-up-and-see-me-steve-harley-cockney-rebel","projects":["kes"]},{"title":"Man of the World","artist":"Peter Green","notes":"Gitarintro, to veiv + mellomspill. Første vers uten trommer. Hi hat + B BB S (kantslag). Hardt stopp etter første veiv med trommer. Vent på gitar, hh + kant > Gå over til hard ride + skarp-rytme, en veiv. Outro kun gitar. Kommer inn helt på slutt med ride x 2.","bpm":92,"start":"GITAR","tags":["blues","rolig"],"energy":"rolig","id":"man-of-the-world-peter-green","projects":["kes"]},{"title":"No Place To Go","artist":"Fleetwood Mac","notes":"Blues, starter med gitar, kommer inn på off-rytme, ride swing + skarp (annenhvert basslag). Gjennomgående likt.","bpm":144,"start":"GITAR","tags":["blues"],"energy":"høy","id":"no-place-to-go-fleetwood-mac","projects":["kes"]},{"title":"Oh Baby","artist":"Status Quo","notes":"Git. start, bygger opp rytme til «I wanna be your dog-rytme». Lettere på vers. 4/4 hi-hat. Ride på solodel (blues). Husk brekk på bridge. Slutter med brekkene fra bridge.","bpm":109,"start":"GITAR","tags":["rock","blues"],"energy":"middels","id":"oh-baby-status-quo","projects":["kes"]},{"title":"People Are Strange","artist":"The Doors","notes":"Beg m/ gitar. Inn inn på ref. Med harde stopp, siste slag etter ‘rain’. Ride + ghost. Stopp etter solo. Stopper på «When your.. strange».","bpm":119,"start":"GITAR","tags":["rock","pop"],"energy":"middels","id":"people-are-strange-the-doors","projects":["kes"]},{"title":"Perfectly Lonely","artist":"John Mayer","notes":"To støt på gitar, så ridedrevet 4/4. Over til hh på vers. Veksle over til ride på gitarveiv. Intro til bridge med 8x singelslag, over til ride.","bpm":92,"start":"GITAR","tags":["pop","groove"],"energy":"middels","id":"perfectly-lonely-john-mayer","projects":["kes"]},{"title":"Rosie","artist":"John Mayer","notes":"Tell opp sakte > Rett på med hi hat + skarp (B S BB B). Ride på vers. Virvel før solo. 8 takter på slutten.","bpm":139,"start":"TELL","tags":["pop","groove"],"energy":"høy","id":"rosie-john-mayer","projects":["kes"]},{"title":"Ruby","artist":"Gary Holton & Casino Steel","notes":"2 takter sakte 16-del, pause hi-hat > Stopp på slutten av ref. etter «Oh Ruuby.. +». Husk gulvtom + hi hat. Begynn beat igjen etter siste vokal før bam/stopp.","bpm":97,"start":"HH","tags":["country","pop"],"energy":"middels","id":"ruby-gary-holton-casino-steel","projects":["kes"]},{"title":"Sad Eyes","artist":"Bruce Springsteen","notes":"Beg. gitar, kommer inn etter 1 takt, kantslag + hi-hat, soft/lounge\nStopp etter “Come on dressed, one more step”, hold på hi-hat. Ref inn igjen etter kort pause.","bpm":115,"start":"GITAR","tags":["rolig","pop"],"energy":"rolig","id":"sad-eyes-bruce-springsteen","projects":["kes"]},{"title":"Start Me Up","artist":"The Rolling Stones","notes":"Begynner med gitar, trommer kommer inn med hi-hat splash + basstromme. Enkeltslag skarp. Deretter hente inn hihat-rytme. Ride på ref.","bpm":122,"start":"GITAR","tags":["rock","dans"],"energy":"høy","id":"start-me-up-the-rolling-stones","projects":["kes"]},{"title":"Sunny Afternoon","artist":"The Kinks","notes":"Husk tempo! 122. Beg med bass, kommer inn med 1-2-3-4-5-6 skarp. Soft beat hi-hat 4/4.","bpm":123,"start":"BASS","tags":["pop","rolig","singalong"],"energy":"rolig","id":"sunny-afternoon-the-kinks","projects":["kes"]},{"title":"Take Me Home, Country Roads","artist":"John Denver","notes":"Git. start, hold tap på skarp. Jazz stomp, visper beg. på refreng.","bpm":83,"start":"GITAR","tags":["country","singalong"],"energy":"middels","id":"take-me-home-country-roads-john-denver","projects":["kes"]},{"title":"The Thrill Is Gone","artist":"Gary Moore feat. BB King","notes":"Husk tempo! Blues, kommer inn litt etter bass. Hi-hat + kantslag.\nEtter første vers, kom inn med fast rytme skarp. Solo. Varier med kantslag pianoissimo på solo underveis.","bpm":91,"start":"BASS","tags":["blues","rolig"],"energy":"rolig","id":"the-thrill-is-gone-gary-moore-feat-bb-king","projects":["kes"]},{"title":"The Weight","artist":"The Band","notes":"Beg. m/gitar 2 takter, sakte roll overg. Kort solo > siste vers + ref > to runder etter ‘slutt’.","bpm":72,"start":"GITAR","tags":["rock","singalong"],"energy":"middels","id":"the-weight-the-band","projects":["kes"]},{"title":"Time Is On My Side","artist":"The Rolling Stones","notes":"Husk tempo: Beg. m/gitar. Trommer inn på ref. Sakte blues-ride > time time time x 3 > 1-2-3-4-5—6 på ride.","bpm":109,"start":"GITAR","tags":["blues","rolig"],"energy":"rolig","id":"time-is-on-my-side-the-rolling-stones","projects":["kes"]},{"title":"Use Somebody","artist":"Kings Of Leon","notes":"Tell opp: Rett på med crashriderytme. Stopp på 1. vers. Bygger opp på 2. vers. > ref crashride > vanlig rytme på 3. vers + bygger opp til crashride ref. Bridge på tammer > ovreg. crashride til solo >  x someone like you/use somebody > Fullt stopp. La henge på gitar + stopp med gulvtomroll.","bpm":70,"start":"TELL","tags":["rock","singalong"],"energy":"middels","id":"use-somebody-kings-of-leon","projects":["kes"]},{"title":"When I Was A Boy","artist":"Jeff Lynne’s ELO","notes":"Beg. gitar > kommer inn med liten roll > 4/4, varier med ride. Liten overgang til vers. Slutter på «When I was a boy» 1-2--3 ride.","bpm":75,"start":"GITAR","tags":["rolig","pop"],"energy":"rolig","id":"when-i-was-a-boy-jeff-lynnes-elo","projects":["kes"]},{"title":"While My Guitar Gently Weeps","artist":"The Jeff Healey Band","notes":"Beg. gitar, kommer inn på lang tom-inngang. Tung. 16-dels hh. 4/4. Solo > slutt.","bpm":135,"start":"GITAR","tags":["rock","blues"],"energy":"høy","id":"while-my-guitar-gently-weeps-the-jeff-healey-band","projects":["kes"]},{"title":"Who Says","artist":"John Mayer","notes":"Tell opp. Visper. Etter solo, vent, kom inn igjen","bpm":90,"start":"TELL","tags":["rolig","pop"],"energy":"rolig","id":"who-says-john-mayer","projects":["kes"]},{"title":" function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function norm(v){return String(v??"").toLowerCase()}function slug(v){return v.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("id"+Date.now())}function uid(p="id"){return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function status(t){$("status").textContent=t||""}function renderDirty(){$("draftBanner")?.classList.toggle("show",dirty)}function saveDraft(){dirty=true;const payload={schemaVersion:SCHEMA_VERSION,songs,projects,savedAt:new Date().toISOString(),dirty:true};localStorage.setItem(DRAFT,JSON.stringify(payload));localStorage.setItem(SHARED_DATA_KEY,JSON.stringify(payload));status("Lokalt utkast lagret");renderDirty()}
function applyTheme(){document.documentElement.dataset.theme=theme;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==="light"?"#f4f6f8":"#111214";if($("themeBtn"))$("themeBtn").textContent=`Tema: ${theme==="light"?"lys":"mørk"}`}function toggleTheme(){theme=theme==="light"?"dark":"light";localStorage.setItem(THEME_KEY,theme);applyTheme()}applyTheme();
function setEditorProject(id){activeEditorProject=id;localStorage.setItem(EDITOR_PROJECT_KEY,id);render()}
function normalize(){projects.forEach(p=>{if(p.id==="pubband"){p.id="kes";p.name="KES"}});if(!projects.length)projects=[{id:"kes",name:"KES",setlists:[{id:"standard",name:"Standard",items:[]}]}];songs.forEach(s=>{s.id ||= slug(`${s.title} ${s.artist}`);s.projects=Array.isArray(s.projects)?[...new Set(s.projects.map(x=>x==="pubband"?"kes":x))]:[projects[0].id]});projects.forEach(p=>{p.setlists||=[];if(!p.setlists.length)p.setlists=[{id:"standard",name:"Standard",items:[]}]})}
function validateSongs(list){const errs=[];if(!Array.isArray(list))return["songs må være en array"];const ids=new Set();list.forEach((s,i)=>{if(!s||typeof s!=="object")errs.push(`Låt ${i+1}: ugyldig objekt`);else{if(!String(s.title||"").trim())errs.push(`Låt ${i+1}: mangler title`);if(!String(s.artist||"").trim())errs.push(`Låt ${i+1}: mangler artist`);if(s.id&&ids.has(s.id))errs.push(`Duplikat id: ${s.id}`);if(s.id)ids.add(s.id);if(s.bpm!=null&&(!Number.isFinite(Number(s.bpm))||Number(s.bpm)<=0))errs.push(`${s.title||`Låt ${i+1}`}: ugyldig BPM`);if(s.projects!=null&&!Array.isArray(s.projects))errs.push(`${s.title||`Låt ${i+1}`}: projects må være array`)}});return errs}
function validateProjects(list,songList=songs){const errs=[];if(!Array.isArray(list))return["projects må være en array"];const pids=new Set(),sids=new Set(songList.map(s=>s.id));list.forEach((p,i)=>{if(!p.id)errs.push(`Prosjekt ${i+1}: mangler id`);else if(pids.has(p.id))errs.push(`Duplikat prosjekt-id: ${p.id}`);else pids.add(p.id);if(!p.name)errs.push(`Prosjekt ${i+1}: mangler navn`);(p.setlists||[]).forEach(l=>(l.items||[]).forEach(it=>{if(it.type==="song"&&!sids.has(it.songId))errs.push(`${p.name||p.id}: settliste «${l.name||l.id}» refererer til ukjent songId ${it.songId}`)}))});return errs}
function assertValid(newSongs,newProjects){const errs=[...validateSongs(newSongs),...validateProjects(newProjects,newSongs)],pids=new Set((newProjects||[]).map(p=>p.id));(newSongs||[]).forEach(s=>(s.projects||[]).forEach(pid=>{if(!pids.has(pid))errs.push(`${s.title||s.id}: ukjent prosjekt-id ${pid}`)}));if(errs.length)throw new Error(errs.slice(0,12).join("\n")+(errs.length>12?`\n… og ${errs.length-12} flere feil`:""))}
async function fetchData(){const [sr,pr]=await Promise.all([fetch(`./songs.json?v=${Date.now()}`,{cache:"no-store"}),fetch(`./projects.json?v=${Date.now()}`,{cache:"no-store"})]);if(!sr.ok||!pr.ok)throw new Error("Kunne ikke hente data");let sd=await sr.json(),pd=await pr.json();songs=Array.isArray(sd)?sd:(sd.songs||[]);projects=Array.isArray(pd)?pd:(pd.projects||[]);normalize()}
async function load(){const candidates=[DRAFT,LEGACY_DRAFT,SHARED_DATA_KEY].map(k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}}).filter(d=>d&&Array.isArray(d.songs)&&d.songs.length&&d.dirty).sort((a,b)=>String(b.savedAt||"").localeCompare(String(a.savedAt||"")));const d=candidates[0];if(d){songs=d.songs;projects=d.projects||structuredClone(FALLBACK_PROJECTS);dirty=true;normalize();status("Lokalt utkast lastet");render();renderDirty();return}try{await fetchData();dirty=false;localStorage.setItem(SHARED_DATA_KEY,JSON.stringify({schemaVersion:SCHEMA_VERSION,songs,projects,savedAt:new Date().toISOString(),dirty:false}));status("Publisert data lastet")}catch{songs=structuredClone(FALLBACK_SONGS);projects=structuredClone(FALLBACK_PROJECTS);normalize();status("Fallback-data lastet")}render();renderDirty()}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("songsList").style.display=tab==="songs"?"grid":"none";$("projectsList").style.display=tab==="projects"?"grid":"none";if(activeEditorProject==="pubband")activeEditorProject="kes";if(activeEditorProject!=="all"&&!projects.some(p=>p.id===activeEditorProject))activeEditorProject="all";$("projectFilter").innerHTML=`<option value="all">Alle prosjekter</option>`+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");$("projectFilter").value=activeEditorProject;const activeName=projects.find(p=>p.id===activeEditorProject)?.name;$("projectHint").textContent=activeEditorProject==="all"?"Viser låter fra alle prosjekter. Nye låter legges som standard i første prosjekt.":`Viser ${activeName}. Nye låter legges automatisk i dette prosjektet.`;const q=norm($("search").value);if(tab==="songs"){const rows=songs.filter(s=>(activeEditorProject==="all"||(s.projects||[]).includes(activeEditorProject))&&norm([s.title,s.artist,s.tags?.join(" ")].join(" ")).includes(q)).sort((a,b)=>a.title.localeCompare(b.title,"nb"));$("songsList").innerHTML=rows.map(s=>`<div class="item"><div class="itemhead"><div><strong>${esc(s.title)}</strong><small>${esc(s.artist)}${s.bpm?` · ${s.bpm} BPM`:""} · ${(s.projects||[]).map(pid=>projects.find(p=>p.id===pid)?.name||pid).join(", ")}</small></div><button class="editbtn" data-song="${esc(s.id)}">Rediger</button></div></div>`).join("");$("count").textContent=activeEditorProject==="all"?`${songs.length} låter`:`${rows.length} låter i ${activeName}`;}else{$("projectsList").innerHTML=projects.map(p=>`<div class="item"><div class="itemhead"><div><strong>${esc(p.name)}</strong><small>${songs.filter(s=>(s.projects||[]).includes(p.id)).length} låter · ${(p.setlists||[]).length} settlister</small></div><div class="itemactions"><button class="usebtn ${activeEditorProject===p.id?"active":""}" data-select-project="${esc(p.id)}">${activeEditorProject===p.id?"Valgt":"Velg"}</button><button class="editbtn" data-rename-project="${esc(p.id)}">Gi nytt navn</button><button class="projectdelete" data-delete-project="${esc(p.id)}">Slett</button></div></div></div>`).join("");$("count").textContent=`${projects.length} prosjekter`;}}
function openSong(id=null){const defaultProject=activeEditorProject!=="all"?activeEditorProject:projects[0]?.id;const s=id?songs.find(x=>x.id===id):{id:"",title:"",artist:"",bpm:null,start:"",energy:"middels",tags:[],projects:[defaultProject],notes:""};$("songDialogTitle").textContent=id?"Rediger låt":"Ny låt";$("songId").value=s.id;$("title").value=s.title;$("artist").value=s.artist;$("bpm").value=s.bpm||"";$("start").value=s.start||"";$("energy").value=s.energy||"middels";$("tags").value=(s.tags||[]).join(", ");$("notes").value=s.notes||"";$("songProjects").innerHTML=projects.map(p=>`<label><input type="checkbox" value="${esc(p.id)}" ${(s.projects||[]).includes(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("");$("deleteSongBtn").style.visibility=id?"visible":"hidden";$("songDialog").showModal()}
function openProject(id=null){const p=id?projects.find(x=>x.id===id):{id:"",name:""};$("projectDialogTitle").textContent=id?"Rediger prosjekt":"Nytt prosjekt";$("projectId").value=p.id;$("projectName").value=p.name;$("deleteProjectBtn").style.visibility=id?"visible":"hidden";$("projectDialog").showModal()}
$("songForm").onsubmit=e=>{e.preventDefault();let id=$("songId").value||slug(`${$("title").value} ${$("artist").value}`);const selected=[...$("songProjects").querySelectorAll("input:checked")].map(i=>i.value);const item={id,title:$("title").value.trim(),artist:$("artist").value.trim(),bpm:$("bpm").value?Number($("bpm").value):null,start:$("start").value.trim(),energy:$("energy").value,tags:$("tags").value.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean),projects:selected.length?selected:[projects[0].id],notes:$("notes").value.trim()};const i=songs.findIndex(s=>s.id===id);if(i>=0)songs[i]=item;else songs.push(item);saveDraft();$("songDialog").close();render()};
$("deleteSongBtn").onclick=()=>{const id=$("songId").value;if(id&&confirm("Slette låten?")){songs=songs.filter(s=>s.id!==id);projects.forEach(p=>p.setlists?.forEach(l=>l.items=l.items.filter(it=>it.songId!==id)));saveDraft();$("songDialog").close();render()}};
$("projectForm").onsubmit=e=>{e.preventDefault();const isNew=!$("projectId").value;let id=$("projectId").value||slug($("projectName").value);const name=$("projectName").value.trim();const p=projects.find(x=>x.id===id);if(p)p.name=name;else projects.push({id,name,setlists:[{id:"standard",name:"Standard",items:[]}]});if(isNew){activeEditorProject=id;localStorage.setItem(EDITOR_PROJECT_KEY,id);tab="songs"}saveDraft();$("projectDialog").close();status(isNew?`Prosjekt «${name}» opprettet og valgt`:`Prosjekt «${name}» lagret`);render()};
function deleteProjectById(id){const project=projects.find(p=>p.id===id);if(!project)return;if(projects.length<2){alert("Du må ha minst ett prosjekt.");return}const songCount=songs.filter(s=>(s.projects||[]).includes(id)).length;if(!confirm(`Slette prosjektet «${project.name}»? Prosjektkoblingen fjernes fra ${songCount} låter, men selve låtene slettes ikke.`))return;projects=projects.filter(p=>p.id!==id);songs.forEach(s=>{s.projects=Array.isArray(s.projects)?s.projects.filter(pid=>pid!==id):[]});if(activeEditorProject===id){activeEditorProject="all";localStorage.setItem(EDITOR_PROJECT_KEY,"all")}saveDraft();if($("projectDialog").open)$("projectDialog").close();status(`Prosjekt «${project.name}» slettet`);render()}
$("deleteProjectBtn").onclick=()=>deleteProjectById($("projectId").value);
$("addSongBtn").onclick=()=>openSong();$("addProjectBtn").onclick=()=>openProject();$("themeBtn").onclick=toggleTheme;$("projectFilter").onchange=e=>setEditorProject(e.target.value);$("closeSongBtn").onclick=$("cancelSongBtn").onclick=()=>$("songDialog").close();$("closeProjectBtn").onclick=$("cancelProjectBtn").onclick=()=>$("projectDialog").close();$("songsList").onclick=e=>{const b=e.target.closest("[data-song]");if(b)openSong(b.dataset.song)};$("projectsList").onclick=e=>{const choose=e.target.closest("[data-select-project]");if(choose){setEditorProject(choose.dataset.selectProject);tab="songs";render();return}const rename=e.target.closest("[data-rename-project]");if(rename){openProject(rename.dataset.renameProject);return}const del=e.target.closest("[data-delete-project]");if(del){deleteProjectById(del.dataset.deleteProject)}};$("search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
[$("songDialog"),$("projectDialog")].forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$("exportSongsBtn").onclick=()=>download("songs.json",songs);$("exportProjectsBtn").onclick=()=>download("projects.json",projects);$("exportAllBtn").onclick=()=>download("gig-settliste-data.json",{app:"Gig-settliste",version:APP_VERSION,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),songs,projects});
$("reloadBtn").onclick=async()=>{try{if(dirty&&!confirm("Lokale endringer er ikke publisert. Hente publisert data og forkaste det lokale utkastet?"))return;await fetchData();assertValid(songs,projects);dirty=false;localStorage.removeItem(DRAFT);localStorage.removeItem(LEGACY_DRAFT);localStorage.setItem(SHARED_DATA_KEY,JSON.stringify({schemaVersion:SCHEMA_VERSION,songs,projects,savedAt:new Date().toISOString(),dirty:false}));status("Publisert data hentet");render();renderDirty()}catch(err){alert(err.message)}};$("discardBtn").onclick=()=>{if(confirm("Forkaste lokalt utkast?")){localStorage.removeItem(DRAFT);localStorage.removeItem(LEGACY_DRAFT);localStorage.removeItem(SHARED_DATA_KEY);dirty=false;load()}};
async function importJsonFile(file,kind){try{const d=JSON.parse(await file.text());let ns=songs,np=projects;if(kind==="songs")ns=Array.isArray(d)?d:d.songs;if(kind==="projects")np=Array.isArray(d)?d:d.projects;if(kind==="all"){ns=d.songs;np=d.projects}assertValid(ns,np);songs=ns;projects=np;normalize();saveDraft();render()}catch(err){alert(`Import stoppet:\n${err.message}`)}}
$("importSongs").onchange=async e=>{const f=e.target.files[0];if(f)await importJsonFile(f,"songs");e.target.value=""};$("importProjects").onchange=async e=>{const f=e.target.files[0];if(f)await importJsonFile(f,"projects");e.target.value=""};$("importAll").onchange=async e=>{const f=e.target.files[0];if(f)await importJsonFile(f,"all");e.target.value=""};
load();
