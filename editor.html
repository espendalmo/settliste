<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Rediger repertoar</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--panel2:#24272b;--text:#f4f5f7;--muted:#a6abb3;--accent:#68b8ff;--border:#30343a;--danger:#ff7777}
*{box-sizing:border-box}html{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{width:min(780px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 88%,transparent)}.toprow{display:flex;gap:7px}.back,.primary,.secondary,.danger{min-height:43px;border-radius:10px;padding:0 12px;font-weight:750}.back,.secondary{border:1px solid var(--border);background:var(--panel);color:var(--text);text-decoration:none;display:flex;align-items:center}.primary{border:0;background:var(--accent);color:#07131e}.danger{border:1px solid #583838;background:transparent;color:var(--danger)}
#search{width:100%;margin-top:7px;min-height:46px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);padding:0 13px;font-size:16px}
.info{margin:8px 2px 13px;color:var(--muted);font-size:12px;line-height:1.4}.list{display:grid;gap:7px}.item{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px 11px}.itemhead{display:flex;justify-content:space-between;gap:10px}.item strong{display:block;font-size:16px}.item small{color:var(--muted)}.editbtn{border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);min-width:58px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.filelabel{min-height:43px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750}.filelabel input{display:none}
dialog{width:min(94vw,620px);max-height:90dvh;overflow:auto;border:1px solid var(--border);border-radius:16px;padding:0;background:var(--panel);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.75)}form{padding:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:9px;background:#141619;color:var(--text);padding:10px}textarea{min-height:130px;resize:vertical}.formactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.meta{color:var(--muted);font-size:12px;margin:0 0 10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="toprow">
      <a class="back" href="index.html">← Settliste</a>
      <button class="primary" id="addBtn">+ Ny låt</button>
    </div>
    <input id="search" type="search" placeholder="Søk i repertoaret …">
  </div>

  <p class="info">
    Endringer her lagres lokalt i nettleseren mens du jobber. Når du er ferdig, trykk <strong>Eksporter songs.json</strong> og erstatt filen på webhotellet/GitHub. Settlisten vil deretter hente den nye feeden automatisk.
  </p>

  <div class="actions">
    <button class="primary" id="exportBtn">Eksporter songs.json</button>
    <label class="filelabel">Importer songs.json<input id="importInput" type="file" accept=".json,application/json"></label>
  </div>

  <p class="meta" id="count"></p>
  <div class="list" id="list"></div>
</main>

<dialog id="editDialog">
<form method="dialog" id="songForm">
  <input type="hidden" id="originalTitle">
  <div class="grid">
    <div class="field full"><label for="title">Låttittel</label><input id="title" required></div>
    <div class="field full"><label for="artist">Artist</label><input id="artist" required></div>
    <div class="field"><label for="bpm">BPM</label><input id="bpm" type="number" min="1" max="300" inputmode="numeric"></div>
    <div class="field"><label for="start">Starttype</label><input id="start" placeholder="TELL, GITAR, BASS …"></div>
    <div class="field"><label for="energy">Energi</label><select id="energy"><option value="rolig">rolig</option><option value="middels">middels</option><option value="høy">høy</option></select></div>
    <div class="field"><label for="tags">Tags</label><input id="tags" placeholder="rock, dans, singalong"></div>
    <div class="field full"><label for="notes">Notater</label><textarea id="notes"></textarea></div>
  </div>
  <div class="formactions">
    <button type="button" class="danger" id="deleteBtn">Slett</button>
    <button class="primary" value="save">Lagre</button>
  </div>
</form>
</dialog>

<script>
const DRAFT_KEY="gig-settliste-editor-draft-v1";
const FALLBACK_SONGS=[{"title":"Abracadabra","artist":"Steve Miller Band","notes":"Tell 1-2-3-4-1-2-3-BAM > Rett på med skarpslag - crash (S BB). Disco beat, gå over til ride helt mot slutten. Dovregubben på slutten, gitar alene, rock outro.","bpm":129,"start":"TELL","tags":["rock","dans"],"energy":"høy"},{"title":"Black Magic Woman","artist":"Santana","notes":"To x klakk på bjelle før hi-hat. 2 veiver, før overgang til vers. Kubjelle + hi-hat + kantslag på vers. Ride + solo > vers m/kubjelle. Siste runde med hh. 7 ridecrash på slutten.","bpm":124,"start":"BJELLE","tags":["latin","rock","blues"],"energy":"middels"},{"title":"Breakfast In America","artist":"Supertramp","notes":"Intro på gitar > inn etter to takter, med minivirvel. Stopp etter slutt på ref. Leken ride på bridge, kort. Stopp. Naa-naa. Slutter med ride + crash. Rit på slutten.","bpm":75,"start":"GITAR","tags":["pop","rolig"],"energy":"rolig"},{"title":"Brown Eyed Girl","artist":"Van Morrison","notes":"Tell opp, Halvslag hi-hat fra start, husk kant slag i intro 4. slag bass\nFader ut?","bpm":150,"start":"TELL","tags":["pop","dans","singalong"],"energy":"høy"},{"title":"Can’t Help Falling In Love","artist":"Elvis Presley","notes":"Rett på med visper eller rods 16-dels hi hat + basstromme. Rit på slutten","bpm":100,"start":"RETT PÅ","tags":["rolig","ballade"],"energy":"rolig"},{"title":"Come Together","artist":"The Beatles","notes":"Husk klut over gulvtam. Tell opp: 4x hh > vers > 4x hh > vers > 4x hh > vers > 2x hh > overg. crash/ride rytme (solo) > stopp. Vers g.tom > 4x hh > overg. crash/ride rytme (outro).","bpm":83,"start":"TELL","tags":["rock","groove"],"energy":"middels"},{"title":"Crazy Little Thing Called Love","artist":"Queen","notes":"Beg. med gitar. Elvis swing beat på hi-hat > stopp på hvert vers. Husk brekk på slutt av ref, klikking etter første bass. Etter solo, slutt med dempet crash > brekk > til klappeparti > ‘love’, kom inn igjen med skarp > vers > Når ikke synger mer, stopp med 1-2-3-4-5-6 på ride","bpm":77,"start":"GITAR","tags":["rock","dans"],"energy":"høy"},{"title":"Dead Flowers","artist":"The Rolling Stones","notes":"Litt fart her. Tell opp, starter med roll, kommer > 4/4. Avslutter etter siste “Won’t forget to put roses on your grave” 1-2-krasj","bpm":130,"start":"TELL","tags":["rock","country"],"energy":"høy"},{"title":"Deidres Samba","artist":"Cornelis Vreeswijk","notes":"Tell opp: Sambarytme m/fast b.tr + hh sammen med Ekka. Harmoniser. BB H BB H","bpm":null,"start":"TELL","tags":["samba","rolig"],"energy":"rolig"},{"title":"Dimples","artist":"John Lee Hooker","notes":"Blues: Beg. m/gitar, gå over til (B S B S BB) + swingride på hi-hsy. Varier med ride og crash. Husk slutt, hold slagene på skarp i basslinje, slutt.","bpm":137,"start":"GITAR","tags":["blues","dans"],"energy":"høy"},{"title":"Englishman In New York","artist":"Sting","notes":"Tell opp, begynner m/tom TT T splash > hi-hat virvel/splash + b.tromme + kantslag (gjennomgående) > ref. ride > vers > ref. ride > overgang til bridge > stadion-basstromme-veiv x 2 > roll overg. til vers + 6 x ‘be your self’ singalon > ref > roll overg. til stadion beat 2 x > slutt.","bpm":102,"start":"TELL","tags":["pop","reggae"],"energy":"middels"},{"title":"Folsom Prison Blues","artist":"Johnny Cash","notes":"Intro på gitar + b.tromme -> Train beat. Ride på solo To ganger på slutten, før avslutn.","bpm":102,"start":"GITAR","tags":["country","dans"],"energy":"høy"},{"title":"From Hank to Hendrix","artist":"Neil Young","notes":"For det meste stomping på hi-hat, veksle med soft beat","bpm":109,"start":"RETT PÅ","tags":["rolig","country"],"energy":"rolig"},{"title":"Get It On","artist":"T. Rex","notes":"Beg. m/gitar. Kommer inn m S B, S B. 4/4 hi-hat > Alle slag på ‘Get in on’. Stopp etter tredje ref. «Get in on», en takt etter.","bpm":127,"start":"GITAR","tags":["rock","dans"],"energy":"høy"},{"title":"Help Me","artist":"Sonny Boy Williamson II","notes":"Rett på. Slow blues, slepende visper eller mutet driv (BSBSBSSBS) Ride på slutten. Stopp, to slag på ride helt slutt.","bpm":114,"start":"RETT PÅ","tags":["blues","rolig"],"energy":"rolig"},{"title":"Human","artist":"The Killers","notes":"Rett på med hi-hat 16-del. Gå på med pumpebass > kutt hi-hat på første ref (kun b.tromme) > over til beat med gulvtam ut låta > evt veiv med kun basstr. for singalong > over til kun b.tromme (stopp rett før ‘are we dancer’).","bpm":135,"start":"RETT PÅ","tags":["pop","dans","singalong"],"energy":"høy"},{"title":"I Heard It Through The Grapewine","artist":"Creedence Clearwater Revival","notes":"Tell opp: Rett på med hi-hat på 2. slag (4 takter), før kommer inn på 4/4. Etter ref > tam-er i 8 takter (3 ganger) > solo > avslutn.","bpm":119,"start":"TELL","tags":["rock","groove"],"energy":"middels"},{"title":"I Shot The Sheriff","artist":"Eric Clapton","notes":"Git start > Start med hh+b.tromme > kommer inn T SS T. Etter 3. vers, to runder før avslutning.","bpm":94,"start":"GITAR","tags":["reggae","blues"],"energy":"middels"},{"title":"I’m Gonna Be (500 Miles)","artist":"The Proclaimers","notes":"Tell opp > Starter med hi-hat, går over til b.trommeslag + skarp. To vers -> ref, nananana. Stopp. Intro med basslag + skarp to takter, kommer mer inn. Husk stopp, synkope ‘coming hooome’. Bygger opp før siste vers/ref.","bpm":132,"start":"TELL","tags":["pop","dans","singalong"],"energy":"høy"},{"title":"I’ll Be Your Baby Tonight","artist":"Bob Dylan","notes":"Tell opp: Rett på med enkel 4/4 (HSHS), perk på 3. vers > ‘stopp’ med perk etter big fat moon’s gonna shine like a spoon. Husk egen outtro, kjør som vanlig.","bpm":128,"start":"TELL","tags":["country","rolig"],"energy":"rolig"},{"title":"Is This Love","artist":"Bob Marley","notes":"Tell opp sakte, husk tempo, rett på med kantslag. Alle b-slag. Krydre med perk.","bpm":122,"start":"TELL","tags":["reggae","dans"],"energy":"høy"},{"title":"La Bamba","artist":"Los Lobos","notes":"Gitarintro, beat over annenhver tom. Husk hardt stopp etter første vers, hardt stopp etter solo. En runde med bamba, så Beatles-slutt.","bpm":161,"start":"GITAR","tags":["latin","dans","singalong"],"energy":"høy"},{"title":"Light My Fire","artist":"The Doors","notes":"Tell opp 1-2-3-4-1-2-3-smekk! Husk egen vri etter solo. Etter solo, 1-2-3-4, 1-2-3-4, deretter vers + ref. 2x. Etter stopp, tell 1-2-3-smekk! til avslutning. Husk rit!","bpm":129,"start":"TELL","tags":["rock"],"energy":"høy"},{"title":"Make Me Smile (Come Up and See Me)","artist":"Steve Harley & Cockney Rebel","notes":"Beg m/skala git/bass, 1111-11 på gulvtom, trommer inn på «You got it all». Husk harde stopp. Kan hende prat i mellom. Slutten; ref i ett to ganger, 4 slag på slutten.","bpm":144,"start":"GITAR/BASS","tags":["rock","pop","singalong"],"energy":"høy"},{"title":"Man of the World","artist":"Peter Green","notes":"Gitarintro, to veiv + mellomspill. Første vers uten trommer. Hi hat + B BB S (kantslag). Hardt stopp etter første veiv med trommer. Vent på gitar, hh + kant > Gå over til hard ride + skarp-rytme, en veiv. Outro kun gitar. Kommer inn helt på slutt med ride x 2.","bpm":92,"start":"GITAR","tags":["blues","rolig"],"energy":"rolig"},{"title":"No Place To Go","artist":"Fleetwood Mac","notes":"Blues, starter med gitar, kommer inn på off-rytme, ride swing + skarp (annenhvert basslag). Gjennomgående likt.","bpm":144,"start":"GITAR","tags":["blues"],"energy":"høy"},{"title":"Oh Baby","artist":"Status Quo","notes":"Git. start, bygger opp rytme til «I wanna be your dog-rytme». Lettere på vers. 4/4 hi-hat. Ride på solodel (blues). Husk brekk på bridge. Slutter med brekkene fra bridge.","bpm":null,"start":"GITAR","tags":["rock","blues"],"energy":"middels"},{"title":"People Are Strange","artist":"The Doors","notes":"Beg m/ gitar. Inn inn på ref. Med harde stopp, siste slag etter ‘rain’. Ride + ghost. Stopp etter solo. Stopper på «When your.. strange».","bpm":119,"start":"GITAR","tags":["rock","pop"],"energy":"middels"},{"title":"Perfectly Lonely","artist":"John Mayer","notes":"To støt på gitar, så ridedrevet 4/4. Over til hh på vers. Veksle over til ride på gitarveiv. Intro til bridge med 8x singelslag, over til ride.","bpm":92,"start":"GITAR","tags":["pop","groove"],"energy":"middels"},{"title":"Rosie","artist":"John Mayer","notes":"Tell opp sakte > Rett på med hi hat + skarp (B S BB B). Ride på vers. Virvel før solo. 8 takter på slutten.","bpm":139,"start":"TELL","tags":["pop","groove"],"energy":"høy"},{"title":"Ruby","artist":"Gary Holton & Casino Steel","notes":"2 takter sakte 16-del, pause hi-hat > Stopp på slutten av ref. etter «Oh Ruuby.. +». Husk gulvtom + hi hat. Begynn beat igjen etter siste vokal før bam/stopp.","bpm":97,"start":"HH","tags":["country","pop"],"energy":"middels"},{"title":"Sad Eyes","artist":"Bruce Springsteen","notes":"Beg. gitar, kommer inn etter 1 takt, kantslag + hi-hat, soft/lounge\nStopp etter “Come on dressed, one more step”, hold på hi-hat. Ref inn igjen etter kort pause.","bpm":115,"start":"GITAR","tags":["rolig","pop"],"energy":"rolig"},{"title":"Start Me Up","artist":"The Rolling Stones","notes":"Begynner med gitar, trommer kommer inn med hi-hat splash + basstromme. Enkeltslag skarp. Deretter hente inn hihat-rytme. Ride på ref.","bpm":122,"start":"GITAR","tags":["rock","dans"],"energy":"høy"},{"title":"Sunny Afternoon","artist":"The Kinks","notes":"Husk tempo! 122. Beg med bass, kommer inn med 1-2-3-4-5-6 skarp. Soft beat hi-hat 4/4.","bpm":123,"start":"BASS","tags":["pop","rolig","singalong"],"energy":"rolig"},{"title":"Take Me Home, Country Roads","artist":"John Denver","notes":"Git. start, hold tap på skarp. Jazz stomp, visper beg. på refreng.","bpm":83,"start":"GITAR","tags":["country","singalong"],"energy":"middels"},{"title":"The Thrill Is Gone","artist":"Gary Moore feat. BB King","notes":"Husk tempo! Blues, kommer inn litt etter bass. Hi-hat + kantslag.\nEtter første vers, kom inn med fast rytme skarp. Solo. Varier med kantslag pianoissimo på solo underveis.","bpm":91,"start":"BASS","tags":["blues","rolig"],"energy":"rolig"},{"title":"The Weight","artist":"The Band","notes":"Beg. m/gitar 2 takter, sakte roll overg. Kort solo > siste vers + ref > to runder etter ‘slutt’.","bpm":72,"start":"GITAR","tags":["rock","singalong"],"energy":"middels"},{"title":"Time Is On My Side","artist":"The Rolling Stones","notes":"Husk tempo: Beg. m/gitar. Trommer inn på ref. Sakte blues-ride > time time time x 3 > 1-2-3-4-5—6 på ride.","bpm":109,"start":"GITAR","tags":["blues","rolig"],"energy":"rolig"},{"title":"Use Somebody","artist":"Kings Of Leon","notes":"Tell opp: Rett på med crashriderytme. Stopp på 1. vers. Bygger opp på 2. vers. > ref crashride > vanlig rytme på 3. vers + bygger opp til crashride ref. Bridge på tammer > ovreg. crashride til solo >  x someone like you/use somebody > Fullt stopp. La henge på gitar + stopp med gulvtomroll.","bpm":70,"start":"TELL","tags":["rock","singalong"],"energy":"middels"},{"title":"When I Was A Boy","artist":"Jeff Lynne’s ELO","notes":"Beg. gitar > kommer inn med liten roll > 4/4, varier med ride. Liten overgang til vers. Slutter på «When I was a boy» 1-2--3 ride.","bpm":75,"start":"GITAR","tags":["rolig","pop"],"energy":"rolig"},{"title":"While My Guitar Gently Weeps","artist":"The Jeff Healey Band","notes":"Beg. gitar, kommer inn på lang tom-inngang. Tung. 16-dels hh. 4/4. Solo > slutt.","bpm":135,"start":"GITAR","tags":["rock","blues"],"energy":"høy"},{"title":"Who Says","artist":"John Mayer","notes":"Tell opp. Visper. Etter solo, vent, kom inn igjen","bpm":90,"start":"TELL","tags":["rolig","pop"],"energy":"rolig"},{"title":"World of Today","artist":"Supermax","notes":"Beg. gitar, kommer inn med 8-dels hi-hat, deretter mekanisk beat B S B S. Husk bygg opp til stopp på hvert ref. Etter solo, ref/vers/ref > slutt på ref.","bpm":147,"start":"GITAR","tags":["funk","dans"],"energy":"høy"},{"title":"Æ Breinn Et Lys i Begge Einann","artist":"K.M. Myrland","notes":"Begynner på tam-er (B BB S). «..skulle be», to takter > slutt. Bare slå løs, lage litt overganger.","bpm":null,"start":"TROMMER","tags":["rock","norsk"],"energy":"middels"}];
let songs=[];
const $=id=>document.getElementById(id);

async function load(){
  const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
  if(Array.isArray(draft)){songs=draft;render();return}
  try{
    const r=await fetch("./songs.json",{cache:"no-store"});
    if(!r.ok)throw new Error();
    songs=await r.json();
  }catch{
    songs=structuredClone(FALLBACK_SONGS);
  }
  render();
}
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify(songs))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const filtered=[...songs].sort((a,b)=>a.title.localeCompare(b.title,"nb",{sensitivity:"base"})).filter(s=>[s.title,s.artist,s.start,s.energy,...(s.tags||[])].join(" ").toLowerCase().includes(q));
  $("list").innerHTML=filtered.map(s=>`<div class="item"><div class="itemhead"><div><strong>${esc(s.title)}</strong><small>${esc(s.artist)}${s.bpm?` · ${s.bpm} BPM`:""}</small></div><button class="editbtn" data-title="${esc(s.title)}">Rediger</button></div></div>`).join("");
  $("count").textContent=`${songs.length} låter i feeden`;
}
function openSong(title=null){
  const s=title?songs.find(x=>x.title===title):{title:"",artist:"",bpm:null,start:"",energy:"middels",tags:[],notes:""};
  $("originalTitle").value=title||"";
  $("title").value=s.title||"";$("artist").value=s.artist||"";$("bpm").value=s.bpm||"";$("start").value=s.start||"";$("energy").value=s.energy||"middels";$("tags").value=(s.tags||[]).join(", ");$("notes").value=s.notes||"";
  $("deleteBtn").style.visibility=title?"visible":"hidden";
  $("editDialog").showModal();
}
$("addBtn").onclick=()=>openSong();
$("list").onclick=e=>{const b=e.target.closest(".editbtn");if(b)openSong(b.dataset.title)};
$("search").oninput=render;
$("songForm").addEventListener("submit",e=>{
  e.preventDefault();
  const original=$("originalTitle").value;
  const item={title:$("title").value.trim(),artist:$("artist").value.trim(),bpm:$("bpm").value?Number($("bpm").value):null,start:$("start").value.trim(),energy:$("energy").value,tags:$("tags").value.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean),notes:$("notes").value.trim()};
  if(!item.title||!item.artist)return;
  if(original){
    const i=songs.findIndex(x=>x.title===original);
    if(i>=0)songs[i]=item;
  }else{
    songs.push(item);
  }
  saveDraft();render();$("editDialog").close();
});
$("deleteBtn").onclick=()=>{
  const original=$("originalTitle").value;
  if(!original)return;
  if(confirm(`Slette "${original}" fra repertoaret?`)){
    songs=songs.filter(x=>x.title!==original);saveDraft();render();$("editDialog").close();
  }
};
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(songs,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="songs.json";a.click();URL.revokeObjectURL(url);
};
$("importInput").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw new Error("Filen må inneholde en JSON-array.");
    songs=data;saveDraft();render();
  }catch(err){alert("Kunne ikke importere filen: "+err.message)}
  e.target.value="";
});
load();
</script>
</body>
</html>
